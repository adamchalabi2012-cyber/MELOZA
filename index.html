mps écoulé, durée et reste ; glissez-la pour aller à un passage.\n↕ Ordre manuel : maintenez une chanson, puis glissez-la.\n🎨 Paramètres : langue, thème, votre nom, tri, sauvegarde, mot de passe.\n🎙 La musique continue quand vous quittez l’application ou éteignez l’écran. Si une autre application émet du son pendant que vous êtes dans MAESTRO_EFOOT, la lecture se met en pause (touchez ▶ pour reprendre).'],

async function bkBuild(only,plName){

async function bkRestore(f){
 try{
  const dec=new TextDecoder();
  if(dec.decode(await f.slice(0,MAG.length).arrayBuffer())!==MAG)throw 0;
  let p=MAG.length;const n=new DataView(await f.slice(p,p+4).arrayBuffer()).getUint32(0,true);p+=4;
  const h=JSON.parse(dec.decode(await f.slice(p,p+n).arrayBuffer()));p+=n;
  if(h.app!=='MAESTRO_EFOOT'||!Array.isArray(h.songs))throw 0;
  const recs=h.songs.map(it=>{
   const au=f.slice(p,p+it.al,it.at);p+=it.al;
   let cv=it.cs;if(cv===undefined&&it.cl!=null){cv=f.slice(p,p+it.cl,it.ct);p+=it.cl}
   const r={id:it.id,title:it.title,artist:it.artist,cover:cv,audio:au,added:it.added};if(it.artists)r.artists=it.artists;if(it.ly)r.lyrics=it.ly;return r;
  });
  if(h.playlist){
   await dbTx('readwrite',o=>{recs.forEach(r=>o.put(r))});
   pls[h.playlist]=[...new Set([...(pls[h.playlist]||[]),...recs.map(r=>r.id)])];S('pls',pls);
   toast(t('plImported'));setTimeout(()=>location.reload(),700);return;
  }
  await dbTx('readwrite',o=>{o.clear();recs.forEach(r=>o.put(r))});
  const keep=['pw','pws','pwq','pwa','pwenc'].map(k=>[k,ls.g(k)]);
  try{localStorage.clear()}catch(e){}
  Object.keys(h.ls||{}).forEach(k=>{if(!/^pw/.test(k))ls.s(k,h.ls[k])});
  keep.forEach(([k,v])=>{if(v!=null)ls.s(k,v)});
  toast(t('restored'));setTimeout(()=>location.reload(),700);
 }catch(e){toast(t('bad'))}
}

function tint(src){
 const my=++tk,im=new Image();
 im.onload=()=>{if(my!==tk)return;try{
  const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');
  x.drawImage(im,0,0,8,8);const d=x.getImageData(0,0,8,8).data;
  let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
  const n=d.length/4;r/=n*255;g/=n*255;b/=n*255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),dd=mx-mn,l=(mx+mn)/2;
  if(dd<.08){document.documentElement.style.setProperty('--ac','#5b6475');return}
  const sa=dd/(1-Math.abs(2*l-1));
  let h=mx===r?((g-b)/dd)%6:mx===g?(b-r)/dd+2:(r-g)/dd+4;h=Math.round(h*60);if(h<0)h+=360;
  document.documentElement.style.setProperty('--ac','hsl('+h+' '+Math.round(Math.min(.85,Math.max(.55,sa))*100)+'% '+(l>.6?36:46)+'%)');
 }catch(e){}};

}

<script>
(function(){
const enc=new TextEncoder();
const sync=n=>[(n>>>21)&127,(n>>>14)&127,(n>>>7)&127,n&127];
const frame=(id,content)=>{const h=[...id].map(c=>c.charCodeAt(0)).concat(sync(content.length),[0,0]);return new Uint8Array([...h,...content])};
const textFrame=(id,txt)=>frame(id,new Uint8Array([3,...enc.encode(String(txt||''))]));
async function coverBytes(c){
 let url=null,own=false;
 if(typeof c==='string'){
  if(c.startsWith('data:image/svg+xml,')){url=URL.createObjectURL(new Blob([decodeURIComponent(c.slice(19))],{type:'image/svg+xml'}));own=true}
  else url=c;
 }else if(c){url=URL.createObjectURL(c);own=true}
 if(!url)return null;
 try{
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const S=512,cv=document.createElement('canvas');cv.width=cv.height=S;
  const x=cv.getContext('2d');
  const k=Math.max(S/img.naturalWidth,S/img.naturalHeight),w=img.naturalWidth*k,h=img.naturalHeight*k;
  x.drawImage(img,(S-w)/2,(S-h)/2,w,h);

  return new Uint8Array(await jb.arrayBuffer());
 }catch(e){return null}
 finally{if(own)URL.revokeObjectURL(url)}
}
window.coverJpeg=coverBytes;
const isMp4=async b=>{if(b.size<12)return false;const h=new Uint8Array(await b.slice(4,8).arrayBuffer());return String.fromCharCode(h[0],h[1],h[2],h[3])==='ftyp'};

const cat=(...a)=>{const n=a.reduce((x,y)=>x+y.length,0);const o=new Uint8Array(n);let p=0;for(const y of a){o.set(y,p);p+=y.length}return o};
const mbox=(type,...pl)=>{const body=cat(...pl);return cat(be32(body.length+8),type,body)};
const T4=x=>enc.encode(x);
const txtItem=(type,txt)=>mbox(type,mbox(T4('data'),be32(1),be32(0),enc.encode(String(txt||''))));
window.buildUdta=function(tags){
 const items=[];
 if(tags.title)items.push(txtItem(new Uint8Array([0xA9,0x6E,0x61,0x6D]),tags.title));
 if(tags.artist)items.push(txtItem(new Uint8Array([0xA9,0x41,0x52,0x54]),tags.artist));
 if(tags.cover)items.push(mbox(T4('covr'),mbox(T4('data'),be32(13),be32(0),tags.cover)));

async function tagMp3(s,src,cov){
 try{
  const bytes=new Uint8Array(await src.arrayBuffer());
  let off=0;
  if(bytes[0]===0x49&&bytes[1]===0x44&&bytes[2]===0x33){off=10+((bytes[6]&127)<<21|(bytes[7]&127)<<14|(bytes[8]&127)<<7|(bytes[9]&127));if(bytes[5]&16)off+=10}
  const parts=[textFrame('TIT2',s.title),textFrame('TPE1',s.artist)];
  if(cov)parts.push(frame('APIC',new Uint8Array([0,...enc.encode('image/jpeg'),0,3,0,...cov])));
  const body=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));
  let o=0;parts.forEach(p=>{body.set(p,o);o+=p.length});
  const head=new Uint8Array([0x49,0x44,0x33,4,0,0,...sync(body.length)]);
  return new Blob([head,body,bytes.subarray(off)],{type:'audio/mpeg'});
 }catch(e){return src}
}
window.taggedBlob=async function(s){
 const orig=s.raw.audio;
 const isMp3=/mpeg|mp3/i.test(orig.type||'')||/\.mp3$/i.test(orig.name||'');
 let cov=null;try{cov=await coverBytes(s.raw.cover)}catch(e){}
 if(isMp3)return tagMp3(s,orig,cov);
 if(!(await isMp4(orig)))return orig;
 try{const a=await window.extractAudio(orig,{title:s.title,artist:s.artist,cover:cov});if(a)return a}
 catch(e){toast(t('extractFail'))}
 return orig;
};
})();

<script>
Object.assign(T,{
 extractFail:['تعذر فصل الصوت من الفيديو، سيُحفظ الملف الأصلي','Could not extract the audio, the original file will be saved','Impossible d’extraire l’audio, le fichier original sera enregistré']

window.extractAudio=async function(blob,tags){
 const u8=new Uint8Array(await blob.arrayBuffer());
 const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
 const str=p=>String.fromCharCode(u8[p],u8[p+1],u8[p+2],u8[p+3]);
 const rd=(p,end)=>{
  const out=[];let q=p;
  while(q+8<=end){
   let size=dv.getUint32(q),hdr=8;const type=str(q+4);
   if(size===1){size=Number(dv.getBigUint64(q+8));hdr=16}
   else if(size===0){size=end-q}
   if(size<hdr||q+size>end)break;
   out.push({type,start:q,end:q+size,body:q+hdr});
   q+=size;
  }
  return out;
 };
 const one=(list,type)=>list.find(b=>b.type===type)||null;
 const top=rd(0,u8.length);
 if(one(top,'moof'))return null;
 const ftyp=one(top,'ftyp'),moov=one(top,'moov'),mdat=one(top,'mdat');
 if(!ftyp||!moov||!mdat)return null;
 const kids=rd(moov.body,moov.end);
 let audio=null,video=false;
 for(const t of kids){
  if(t.type!=='trak')continue;
  const mdia=one(rd(t.body,t.end),'mdia');
  const hdlr=mdia?one(rd(mdia.body,mdia.end),'hdlr'):null;
  const kind=hdlr?str(hdlr.body+8):'';
  if(kind==='vide')video=true;
  if(kind==='soun'&&!audio)audio=t;
 }
 if(!audio||(!video&&!tags))return null;
 const mdiaB=one(rd(audio.body,audio.end),'mdia');
 const minf=mdiaB?one(rd(mdiaB.body,mdiaB.end),'minf'):null;
 const stbl=minf?one(rd(minf.body,minf.end),'stbl'):null;
 if(!stbl)return null;
 const sb=rd(stbl.body,stbl.end);
 const stsz=one(sb,'stsz'),stsc=one(sb,'stsc'),stco=one(sb,'stco'),co64=one(sb,'co64');
 const co=stco||co64;
 if(!stsz||!stsc||!co)return null;
 const is64=!stco;
 const fixedSize=dv.getUint32(stsz.body+4),nSamp=dv.getUint32(stsz.body+8);
 const sizes=new Array(nSamp);
 for(let i=0;i<nSamp;i++)sizes[i]=fixedSize||dv.getUint32(stsz.body+12+4*i);
 const nSc=dv.getUint32(stsc.body+4),sc=[];
 for(let i=0;i<nSc;i++)sc.push({first:dv.getUint32(stsc.body+8+12*i),spc:dv.getUint32(stsc.body+12+12*i)});
 const nCo=dv.getUint32(co.body+4),offs=[];
 for(let i=0;i<nCo;i++)offs.push(is64?Number(dv.getBigUint64(co.body+8+8*i)):dv.getUint32(co.body+8+4*i));
 const ranges=[];let si=0;
 for(let c=0;c<nCo;c++){
  let spc=0;for(const e of sc)if(e.first<=c+1)spc=e.spc;
  let len=0;for(let k=0;k<spc;k++)len+=sizes[si+k];
  ranges.push({off:offs[c],len});si+=spc;
 }
 const total=ranges.reduce((a,r)=>a+r.len,0);
 const ftypBytes=u8.slice(ftyp.start,ftyp.end);
 const trakCopy=u8.slice(audio.start,audio.end);
 const coRel=co.body+8-audio.start;
 const parts=[];
 for(const k of kids){
  if(k.type==='trak'){if(k===audio)parts.push(trakCopy);continue}
  if(k.type==='mvex')continue;
  if(tags&&(k.type==='udta'||k.type==='meta'))continue;
  parts.push(u8.slice(k.start,k.end));
 }
 if(tags)parts.push(window.buildUdta(tags));
 const moovLen=8+parts.reduce((a,p)=>a+p.length,0);
 const base=ftypBytes.length+moovLen+8;
 const tv=new DataView(trakCopy.buffer,trakCopy.byteOffset,trakCopy.byteLength);
 let acc=0;
 ranges.forEach((r,c)=>{
  const v=base+acc;
  if(is64)tv.setBigUint64(coRel+8*c,BigInt(v));
  else{if(v>0xFFFFFFFF)throw new Error("big");tv.setUint32(coRel+4*c,v)}
  acc+=r.len;
 });
 const payload=new Uint8Array(total);
 let w=0;
 for(const r of ranges){payload.set(u8.subarray(r.off,r.off+r.len),w);w+=r.len}
 const mh=new Uint8Array([(moovLen>>>24)&255,(moovLen>>>16)&255,(moovLen>>>8)&255,moovLen&255,109,111,111,118]);
 const dh=new Uint8Array([((total+8)>>>24)&255,((total+8)>>>16)&255,((total+8)>>>8)&255,(total+8)&255,109,100,97,116]);
 return new Blob([ftypBytes,mh,...parts,dh,payload],{type:'audio/mp4'});
};

<script>
(function(){

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
const crcOf=u8=>{let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
const extOf=(type,name)=>{const e=String(name||'').split('.').pop().toLowerCase();if(/^(mp3|m4a|aac|wav|ogg|flac|mp4|jpg|png|webp|svg)$/.test(e))return e;const M={'audio/mpeg':'mp3','audio/mp4':'m4a','video/mp4':'mp4','audio/aac':'aac','audio/wav':'wav','audio/ogg':'ogg','audio/flac':'flac','image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/svg+xml':'svg'};return M[String(type||'').split(';')[0]]||'bin'};
async function crcBlob(b){let c=0xFFFFFFFF;const CH=4194304;for(let o=0;o<b.size;o+=CH){const u=new Uint8Array(await b.slice(o,o+CH).arrayBuffer());for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);await new Promise(r=>setTimeout(r,0))}return (c^0xFFFFFFFF)>>>0}
async function zipStore(entries){
 const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 const dv=n=>new DataView(new ArrayBuffer(n));
 for(const e of entries){
  const nb=enc.encode(e.name),data=e.data,size=data.size;
  const crc=await crcBlob(data);
  const lh=dv(30);
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
  lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),nb,data);
  await new Promise(r=>setTimeout(r,0));
  const ch=dv(46);
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
  ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,nb.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
  cd.push(new Uint8Array(ch.buffer),nb);
  off+=30+nb.length+size;
 }
 const cdSize=cd.reduce((a,p)=>a+p.length,0);
 const end=dv(22);
 end.setUint32(0,0x06054b50,true);end.setUint16(4,0,true);end.setUint16(6,0,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);end.setUint16(20,0,true);

}
async function zipIndex(f){
 const n=Math.min(f.size,65557);
 const tail=new DataView(await f.slice(f.size-n).arrayBuffer());
 let p=-1;for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){p=i;break}
 if(p<0)throw new Error('no directory');
 const count=tail.getUint16(p+10,true),cdSize=tail.getUint32(p+12,true),cdOff=tail.getUint32(p+16,true);
 const cd=new DataView(await f.slice(cdOff,cdOff+cdSize).arrayBuffer());
 const dec=new TextDecoder(),map={};let q=0;
 for(let i=0;i<count;i++){
  const nl=cd.getUint16(q+28,true),el=cd.getUint16(q+30,true),cl=cd.getUint16(q+32,true);
  const name=dec.decode(new Uint8Array(cd.buffer,cd.byteOffset+q+46,nl));
  map[name]={size:cd.getUint32(q+20,true),off:cd.getUint32(q+42,true)};
  q+=46+nl+el+cl;
 }
 return map;
}
async function zipRead(f,map,name){
 const e=map[name];if(!e)return null;
 const lh=new DataView(await f.slice(e.off,e.off+30).arrayBuffer());
 const start=e.off+30+lh.getUint16(26,true)+lh.getUint16(28,true);
 return f.slice(start,start+e.size);
}

const oldRestore=window.bkRestore;
const safeName=x=>String(x||'').replace(/[\/\\:*?"<>|\x00-\x1f]/g,'_').replace(/\s+/g,' ').trim().slice(0,120);
async function bkZipBuild(only,plName){
 const recs=only||((await dbTx('readonly',o=>o.getAll()))||[]);
 const l2={};
 if(!plName)for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!/^pw/.test(k))l2[k]=localStorage.getItem(k)}
 const entries=[],items=[],used={};
 const uniq=b=>{let n=b,i=2;while(used[n.toLowerCase()]){n=b+' ('+i+')';i++}used[n.toLowerCase()]=1;return n};
 for(const r of recs){
  const base=uniq(safeName((r.artist?r.artist+' - ':'')+r.title)||String(r.id));
  const audio=await window.taggedBlob({title:r.title,artist:r.artist,raw:{audio:r.audio,cover:r.cover}});
  const ty=audio.type||'';
  const ext=/mpeg/.test(ty)?'mp3':/mp4/.test(ty)?'m4a':extOf(r.audio.type,r.audio.name);
  const it={id:r.id,title:r.title,artist:r.artist,added:r.added||0};
  if(r.artists)it.artists=r.artists;
  if(r.lyrics)it.ly=r.lyrics;
  it.af='songs/'+base+'.'+ext;
  entries.push({name:it.af,data:audio});
  if(typeof r.cover==='string')it.cs=r.cover;
  const jpg=await window.coverJpeg(r.cover);
  if(jpg){it.cf='covers/'+base+'.jpg';entries.push({name:it.cf,data:new Blob([jpg],{type:'image/jpeg'})})}
  items.push(it);
  await new Promise(x=>setTimeout(x,0));
 }
 const head={app:'MAESTRO_EFOOT',v:3,ls:l2,songs:items};
 if(plName)head.playlist=plName;
 entries.unshift({name:'maestro-data.json',data:new Blob([JSON.stringify(head)],{type:'application/json'})});
 return zipStore(entries);
}
async function zipRestore(f){
 const map=await zipIndex(f);
 const jb=await zipRead(f,map,'maestro-data.json');
 if(!jb)throw new Error('no data');
 const h=JSON.parse(await jb.text());
 if(h.app!=='MAESTRO_EFOOT'||!Array.isArray(h.songs))throw new Error('bad');
 const recs=[];
 for(const it of h.songs){
  const au=await zipRead(f,map,it.af);
  if(!au)continue;
  let cover=it.cs;
  if(cover===undefined&&it.cf)cover=await zipRead(f,map,it.cf);
  const r={id:it.id,title:it.title,artist:it.artist,audio:au,added:it.added};
  if(cover!==undefined&&cover!==null)r.cover=cover;
  if(it.artists)r.artists=it.artists;
  if(it.ly)r.lyrics=it.ly;
  recs.push(r);
 }
 if(h.playlist){
  await dbTx('readwrite',o=>{recs.forEach(r=>o.put(r))});
  pls[h.playlist]=[...new Set([...(pls[h.playlist]||[]),...recs.map(r=>r.id)])];S('pls',pls);
  toast(t('plImported'));setTimeout(()=>location.reload(),700);return;
 }
 await dbTx('readwrite',o=>{o.clear();recs.forEach(r=>o.put(r))});
 const keep=['pw','pws','pwq','pwa','pwenc'].map(k=>[k,ls.g(k)]);
 try{localStorage.clear()}catch(e){}
 Object.keys(h.ls||{}).forEach(k=>{if(!/^pw/.test(k))ls.s(k,h.ls[k])});
 keep.forEach(([k,v])=>{if(v!=null)ls.s(k,v)});

  mailCache[k]=(async()=>{const b=await taggedBlob(s);const nm=songName(s);return new File([audioBlob(b,nm)],nm,{type:b.type||'audio/mpeg'})})();
  mailCache[k].catch(()=>{delete mailCache[k]});

window.sendSong=function(s){

const mzOk=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||''));
const myEmail=()=>String(ls.g('gmail')||'').trim().toLowerCase();
const myName=()=>(String((typeof pname!=='undefined'&&pname)||'').trim())||myEmail().split('@')[0];
const MZ={es:null,topic:'',ok:false};
const MZ_MAX=15*1024*1024;
const UI={view:'list',chatWith:null};
let PRE={};
const msgsGet=()=>J('msgs',[]);
const msgsAdd=m=>{const a=msgsGet();a.push(m);S('msgs',a.slice(-400))};
const contactsGet=()=>J('contacts',[]);
const contactsSet=a=>S('contacts',a);
const reqsGet=()=>J('reqs',[]);
const reqsSet=a=>S('reqs',a);
const isFriend=e=>contactsGet().some(x=>x.email===e&&x.st==='friend');
const nameOf=e=>{const c=contactsGet().find(x=>x.email===e);if(c)return c.name;const r=reqsGet().find(x=>x.email===e);return r?r.name:e};
const seenGet=()=>J('mzSeenAt',{});
function markSeen(email){const a=seenGet();a[email]=Date.now();S('mzSeenAt',a)}
function unreadOf(email){const seen=seenGet()[email]||0;return msgsGet().filter(m=>m.dir==='in'&&m.peer===email&&m.t>seen).length}
function lastOf(email){const L=msgsGet().filter(m=>m.peer===email);return L.length?L[L.length-1]:null}
async function topicOf(email){
 const e=String(email||'').trim().toLowerCase();
 const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('maestro-msg|'+e)));
 return 'mz'+[...h].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function mzPublish(toEmail,payload){
 const topic=await topicOf(toEmail);
 const r=await fetch('https://ntfy.sh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic,message:JSON.stringify(payload)})});
 if(!r.ok)throw new Error('http '+r.status);
}
function befriend(email,name){
 const L=contactsGet().filter(x=>x.email!==email);
 L.push({name:name||email,email:email,st:'friend'});
 contactsSet(L);
 reqsSet(reqsGet().filter(x=>x.email!==email));
}
async function friendAdd(name,email){
 const me=myEmail();
 if(!mzOk(me))throw new Error('me');
 const L=contactsGet().filter(x=>x.email!==email);
 L.push({name:name,email:email,st:'pending'});
 contactsSet(L);
 try{await mzPublish(email,{k:'req',f:me,n:myName()})}
 catch(e){contactsSet(contactsGet().filter(x=>!(x.email===email&&x.st==='pending')));throw e}
}
async function reqAccept(email){
 const me=myEmail();
 const r=reqsGet().find(x=>x.email===email);
 befriend(email,r?r.name:email);
 renderAll();
 await mzPublish(email,{k:'acc',f:me,n:myName()}).catch(()=>{});
}
async function reqReject(email){
 const me=myEmail();
 reqsSet(reqsGet().filter(x=>x.email!==email));
 renderAll();
 await mzPublish(email,{k:'rej',f:me}).catch(()=>{});
}
function friendDel(email){contactsSet(contactsGet().filter(x=>x.email!==email));renderAll()}
async function mzSend(toEmail,text,song){
 const me=myEmail();
 const ts=Date.now();
 const p={k:'txt',f:me,t:String(text||'').slice(0,1000),s:String(song||''),ts:ts};
 await mzPublish(toEmail,p);
 msgsAdd({id:'o'+ts,dir:'out',peer:toEmail,text:p.t,song:p.s,t:ts});
}
async function mzSendFile(toEmail,s){
 const me=myEmail();
 const b=await taggedBlob(s);
 const nm=songName(s);
 const f=audioBlob(b,nm);
 if(f.size>MZ_MAX)throw new Error('big');
 const topic=await topicOf(toEmail);
 const enc=x=>'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(String(x||''))))+'?=';
 let coverUrl='';
 try{
  const cb=await window.coverJpeg(s.raw.cover);
  if(cb&&cb.length<3*1024*1024){
   const cr=await fetch('https://ntfy.sh/'+topic,{method:'PUT',headers:{'Filename':'cover.jpg','Title':enc('cover'),'Message':enc('cover')},body:new Blob([cb],{type:'image/jpeg'})});
   if(cr.ok){const cj=await cr.json();coverUrl=(cj.attachment&&cj.attachment.url)||''}
  }
 }catch(e){coverUrl=''}
 const r=await fetch('https://ntfy.sh/'+topic,{method:'PUT',headers:{'Filename':'song'+nm.slice(nm.lastIndexOf('.')),'Title':enc(s.title),'Message':enc(me+'|'+(s.artist||'')+'|'+coverUrl)},body:f});
 if(!r.ok)throw new Error('http');
 const ts=Date.now();
 msgsAdd({id:'of'+ts,dir:'out',peer:toEmail,text:'',song:s.title+(s.artist?' - '+s.artist:''),t:ts});
}
function mzMark(id){const a=J('mzSeen',[]);if(a.includes(id))return false;a.push(id);S('mzSeen',a.slice(-200));return true}
function mzNotify(from,body){
 if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
  try{new Notification(t('mNew')+' '+nameOf(from),{body:body})}catch(e){}
 }
}
async function mzGetBlob(url){const r=await fetch(url);if(!r.ok)throw new Error('http');return r.blob()}
async function mzAddToLib(m){
 try{
  if(m.file.expires&&Date.now()/1000>m.file.expires)throw new Error('expired');
  const b=await mzGetBlob(m.file.url);
  let cov=null;
  if(m.file.cover){try{cov=await mzGetBlob(m.file.cover)}catch(e){cov=null}}
  const title=m.file.title||m.file.name||'Song';
  const artist=m.file.artist||nameOf(m.peer);
  const id=Date.now()+'-r'+Math.random().toString(36).slice(2,6);
  await dbTx('readwrite',o=>o.put({id:id,title:title,artist:artist,artists:[artist],cover:cov||gcov(0,title),audio:b,added:Date.now()}));
  await refreshLib();
  toast(t('mAdded'));
 }catch(e){toast(e.message==='expired'?t('mExpired'):t('mFail'))}
}
function renderReqs(){
 const el=UI.reqs;if(!el)return;
 el.innerHTML='';

function renderList(){
 const el=UI.list;if(!el)return;
 el.innerHTML='';

 if(!L.length){el.append(E('div',{class:'hint',txt:t('mNoFriends')}));return}
 L.forEach(c=>{
  const ok=c.st==='friend';
  const last=ok?lastOf(c.email):null;
  const prev=last?(last.song?'🎵 '+last.song:(last.text||'')):'';
  const un=ok?unreadOf(c.email):0;
  el.append(E('div',{class:'qi',style:'cursor:'+(ok?'pointer':'default'),on:()=>{if(ok)showChat(c.email)}},
   E('span',{class:'inf'},E('b',{txt:c.name}),E('i',{txt:ok?(prev||c.email):(c.email+' · '+t('mPending'))})),
   un?E('span',{style:'background:var(--ac);color:var(--on);border-radius:999px;padding:2px 9px;font-weight:800;font-size:.75rem',txt:String(un)}):null,
   ok?null:E('button',{type:'button',txt:'✕',on:e=>{e.stopPropagation();friendDel(c.email)}})));
 });
}
function renderChat(){
 const el=UI.chatMsgs;if(!el||!UI.chatWith)return;
 el.innerHTML='';
 const L=msgsGet().filter(m=>m.peer===UI.chatWith);
 if(!L.length)el.append(E('div',{class:'hint',txt:t('mNoChat')}));
 L.slice(-120).forEach(m=>{
  const when=new Date(m.t).toLocaleString(lang==='ar'?'ar':lang==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const expired=m.file&&m.file.expires&&Date.now()/1000>m.file.expires;
  const fileRow=m.file?(expired?E('div',{class:'hint',txt:t('mExpired')}):E('div',{class:'r2'},
    E('button',{class:'chip',type:'button',txt:t('mRecv'),on:()=>mzAddToLib(m)}))):null;
  el.append(E('div',{style:'padding:10px 12px;margin:6px 0;border-radius:14px;background:'+(m.dir==='in'?'var(--el)':'color-mix(in srgb,var(--ac) 16%,transparent)')},
   m.song?E('div',{style:'color:var(--ac);font-weight:700;font-size:.85rem',txt:'🎵 '+m.song}):null,
   m.text?E('div',{class:'hb',txt:m.text}):null,
   fileRow,
   E('div',{style:'color:var(--dim);font-size:.72rem',txt:when})));
 });

function mzStat(){
 const el=UI.stat;if(!el)return;
 const me=myEmail();
 el.textContent=!mzOk(me)?t('mStatNo'):(MZ.ok?t('mStatOn')+' '+me:t('mStatWait'));
}
function renderAll(){renderReqs();renderList();renderChat();mzStat()}
function mzGot(d){
 if(d.time)ls.s('mzLast',String(d.time));
 if(d.attachment&&d.attachment.url){
  const parts=String(d.message||'').split('|');
  const from=(parts[0]||'').trim().toLowerCase();
  if(!isFriend(from))return;
  if(!mzMark(d.id))return;
  const artist=parts[1]||'';
  const cover=parts[2]||'';
  msgsAdd({id:d.id,dir:'in',peer:from,text:'',song:d.title||d.attachment.name||'',
   file:{url:d.attachment.url,name:d.attachment.name||'song.m4a',title:d.title||'',artist:artist,cover:cover,expires:d.attachment.expires||0},
   t:(d.time||Math.floor(Date.now()/1000))*1000});
  mzNotify(from,(d.title||'')+(artist?' - '+artist:''));
  renderAll();
  return;
 }
 let p;try{p=JSON.parse(d.message)}catch(e){return}
 if(!p||!mzOk(p.f))return;
 const from=p.f;
 if(!mzMark(d.id))return;
 if(p.k==='req'){
  if(isFriend(from))return;
  const pend=contactsGet().find(x=>x.email===from&&x.st==='pending');
  if(pend){
   befriend(from,p.n||pend.name);
   mzPublish(from,{k:'acc',f:myEmail(),n:myName()}).catch(()=>{});
   mzNotify(from,t('mAcceptedBy'));renderAll();return;
  }
  const R=reqsGet().filter(x=>x.email!==from);
  R.push({email:from,name:p.n||from,t:Date.now()});reqsSet(R);
  mzNotify(from,t('mReqFrom')+' '+(p.n||from));renderAll();return;
 }
 if(p.k==='acc'){
  const c=contactsGet().find(x=>x.email===from&&x.st==='pending');
  if(c){befriend(from,p.n||c.name);mzNotify(from,(p.n||c.name)+' '+t('mAcceptedBy'));renderAll()}
  return;
 }
 if(p.k==='rej'){
  contactsSet(contactsGet().filter(x=>!(x.email===from&&x.st==='pending')));
  renderAll();return;
 }
 if(!isFriend(from))return;
 msgsAdd({id:d.id,dir:'in',peer:from,text:p.t||'',song:p.s||'',t:(p.ts||d.time*1000)});
 mzNotify(from,(p.s?'🎵 '+p.s+' ':'')+(p.t||''));
 renderAll();
}
async function mzListen(){
 const me=myEmail();
 if(!mzOk(me)){if(MZ.es){MZ.es.close();MZ.es=null;MZ.topic=''}MZ.ok=false;mzStat();return}
 const topic=await topicOf(me);
 if(MZ.es&&MZ.topic===topic)return;
 if(MZ.es)MZ.es.close();
 MZ.topic=topic;
 const since=(+ls.g('mzLast'))||(Math.floor(Date.now()/1000)-43200);
 const es=new EventSource('https://ntfy.sh/'+topic+'/sse?since='+since);
 es.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.event==='message')mzGot(d)}catch(e){}};
 es.onopen=()=>{MZ.ok=true;mzStat()};
 es.onerror=()=>{MZ.ok=false;mzStat()};
 MZ.es=es;
}
async function sendNow(){
 const to=UI.chatWith;
 if(!myEmail())return toast(t('mMeNeed'));
 if(!to)return;
 if(!isFriend(to))return toast(t('mNotFriend'));
 const sb=UI.sendBtn;
 try{
  if(PRE.songId){
   const s=songs.find(x=>x.id===PRE.songId);
   if(!s)throw new Error('nosong');
   sb.disabled=true;toast(t('mSendingFile'));
   await mzSendFile(to,s);
   PRE.songId=null;UI.songLbl.textContent='';UI.fileNote.textContent='';UI.body.hidden=false;
  }else{
   const txt=UI.body.value.trim();
   if(!txt&&!PRE.song)return;
   sb.disabled=true;
   await mzSend(to,txt,PRE.song||'');
   UI.body.value='';PRE.song='';UI.songLbl.textContent='';
  }
  renderAll();toast(t('mSent'));
 }catch(e){toast(e.message==='big'?t('mFileBig'):t('mFail'))}
 sb.disabled=false;
}
function buildSheet(){
 ['reqs','list','chatMsgs','songLbl','fileNote','body','sendBtn','stat'].forEach(k=>{UI[k]=null});
 UI.stat=E('div',{class:'hint'});
 const notifBtn=('Notification' in window&&Notification.permission!=='granted')
  ?E('button',{class:'chip',type:'button',txt:t('mNotif'),on:async()=>{try{await Notification.requestPermission()}catch(e){}notifBtn.remove()}})
  :null;
 if(UI.view==='chat'&&UI.chatWith){
  const c=contactsGet().find(x=>x.email===UI.chatWith);
  UI.chatMsgs=E('div',{style:'max-height:42dvh;overflow:auto;padding:0 2px'});
  UI.songLbl=E('div',{class:'hb',txt:PRE.song?'🎵 '+PRE.song:''});
  UI.fileNote=E('div',{class:'hint',txt:PRE.songId?t('mFileNote')+' '+t('mFileRight'):''});
  UI.body=E('textarea',{placeholder:t('mText')});
  UI.body.hidden=!!PRE.songId;
  UI.sendBtn=E('button',{class:'go',type:'button',txt:t('mSend'),on:sendNow});
  const back=E('button',{class:'chip',type:'button',txt:t('mChatBack'),on:()=>showList()});
  const del=E('button',{class:'chip',type:'button',txt:t('mDelFriend'),on:()=>{friendDel(UI.chatWith);showList()}});
  sheet(c?c.name:UI.chatWith,[
   E('div',{class:'r2'},back,del),UI.stat,notifBtn,UI.chatMsgs,UI.songLbl,UI.fileNote,UI.body
  ].filter(Boolean),[UI.sendBtn,E('button',{type:'button',txt:t('close'),on:()=>$('dlg').close()})]);
 }else{
  const me=myEmail();
  const meLbl=E('div',{class:'hb',txt:me||t('mNoMe')});

Object.assign(T,{

 gIdHelp:['ربط حساب Google يحتاج Client ID مرة واحدة فقط:\n١. ادخل إلى console.cloud.google.com وأنشئ مشروعاً جديداً.\n٢. من APIs & Services فعّل Google Drive API.\n٣. أعدّ شاشة الموافقة OAuth واختر External، وأضف بريدك في Test users.\n٤. من Credentials أنشئ OAuth client ID نوعه Web application.\n٥. في Authorized JavaScript origins أضف هذا الرابط بالضبط: https://adamchalabi2012-cyber.github.io\n٦. انسخ الـ Client ID (وينتهي بـ .apps.googleusercontent.com) والصقه أدناه.','Google sign-in needs a Client ID, once only:\n1. Go to console.cloud.google.com and create a project.\n2. Under APIs & Services, enable Google Drive API.\n3. Set up the OAuth consent screen as External and add your email under Test users.\n4. Under Credentials, create an OAuth client ID of type Web application.\n5. Under Authorized JavaScript origins, add exactly: https://adamchalabi2012-cyber.github.io\n6. Copy the Client ID (ending in .apps.googleusercontent.com) and paste it below.','La connexion Google nécessite un Client ID, une seule fois :\n1. Allez sur console.cloud.google.com et créez un projet.\n2. Dans APIs & Services, activez Google Drive API.\n3. Configurez l’écran de consentement OAuth en External et ajoutez votre e-mail dans Test users.\n4. Dans Credentials, créez un OAuth client ID de type Web application.\n5. Dans Authorized JavaScript origins, ajoutez exactement : https://adamchalabi2012-cyber.github.io\n6. Copiez le Client ID (se terminant par .apps.googleusercontent.com) et collez-le ci-dessous.']
});
function saveClientId(v){
 const id=String(v||'').trim();
 if(!/\.apps\.googleusercontent\.com$/.test(id))return toast(t('gBadId'));
 ls.s('gcid',id);toast(t('saved'));
 setTimeout(()=>location.reload(),700);
}
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function bioAvail(){
 try{return !!(window.PublicKeyCredential&&navigator.credentials&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}
 catch(e){return false}
}
async function bioEnable(){
 const c=await navigator.credentials.create({publicKey:{
  challenge:crypto.getRandomValues(new Uint8Array(32)),
  rp:{name:'MAESTRO_EFOOT'},
  user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'maestro',displayName:pname||'MAESTRO'},
  pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
  authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
  timeout:60000
 }});
 ls.s('pwbio',b64u(c.rawId));
}
async function bioCheck(){
 const id=ls.g('pwbio');if(!id)return false;
 try{
  await navigator.credentials.get({publicKey:{
   challenge:crypto.getRandomValues(new Uint8Array(32)),
   allowCredentials:[{type:'public-key',id:ub64u(id),transports:['internal']}],
   userVerification:'required',timeout:60000
  }});
  return true;
 }catch(e){return false}
}
async function tryBio(ev){
 const manual=ev instanceof Event;
 if(lockMsg())return;
 if(await bioCheck()){ls.s('lkFails','0');rmk('lkUntil');$('lock').hidden=true;$('lkP').value='';$('lkE').textContent=''}
 else if(manual){const sec=lockFail();$('lkE').textContent=sec?t('lkWait').replace('{s}',fmtWait(sec)):t('bioFail')}
}

lkBio.style.cssText='width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;background:var(--el);color:var(--text);font:800 1rem Cairo,system-ui';
$('lkB').after(lkBio);
Object.assign(T,{
 lkGuest:['الدخول كضيف','Enter as guest','Entrer en invité'],
 gHello:['مرحباً بك في MAESTRO_EFOOT. اضغط للمتابعة.','Welcome to MAESTRO_EFOOT. Tap to continue.','Bienvenue sur MAESTRO_EFOOT. Appuyez pour continuer.']
});
const lkGuest=E('button',{id:'lkGuest',type:'button',txt:'👤 '+t('lkGuest'),on:()=>{$('lock').hidden=true;$('lkP').value='';$('lkE').textContent=''}});
lkGuest.style.cssText='width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;background:var(--el);color:var(--text);font:800 1rem Cairo,system-ui';
lkBio.after(lkGuest);
function syncBio(auto){
 lkBio.textContent='👆 '+t('bioUse');
 const on=!!ls.g('pwbio')&&!!ls.g('pw');
 lkBio.hidden=!on;
 if(auto&&on){setTimeout(()=>$('lkP').blur(),120);setTimeout(tryBio,350)}
}
const _lock=window.lockNow;
window.lockNow=function(){_lock();syncBio(true)};

let gTok='',gExp=0,gTC=null,gRes,gRej;
const loadGIS=()=>new Promise((res,rej)=>{
 if(window.google&&google.accounts)return res();
 const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=rej;document.head.append(s);
});
async function gToken(){
 if(gTok&&Date.now()<gExp-6e4)return gTok;
 if(noCfg){toast(t('gCfg'));throw 0}
 await loadGIS();
 return new Promise((res,rej)=>{
  gRes=res;gRej=rej;
  gTC=gTC||google.accounts.oauth2.initTokenClient({
   client_id:GCID,scope:SC,
   callback:r=>{if(r.error)return gRej(r);gTok=r.access_token;gExp=Date.now()+(+r.expires_in||3600)*1e3;gRes(gTok)},
   error_callback:e=>gRej(e)
  });
  gTC.requestAccessToken({prompt:ls.g('gmail')?'':'select_account'});
 });
}
const gf=async(u,o={})=>{
 const tk=await gToken();
 const r=await fetch(u,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+tk}});
 if(!r.ok)throw r;return r;
};
async function gFind(name){
 const r=await gf(DR+'drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+name+"'"));
 return (await r.json()).files[0]||null;
}
async function gAuth(){
 const tk=await gToken();
 const r=await fetch(DR+'oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tk}});
 if(!r.ok)throw r;
 const u=await r.json();
 ls.s('gmail',u.email||'Google');
 return u.email;
}
async function gSignIn(){
 try{await gAuth();toast(t('saved'));window.openSettings()}
 catch(e){if(e)toast(t('fail')+why(e))}
}
function gSignOut(){
 try{if(gTok&&window.google)google.accounts.oauth2.revoke(gTok)}catch(e){}
 gTok='';rmk('gmail');ls.s('guest','1');window.openSettings();
}
async function gBackup(){
 try{
  toast(t('gUping'));
  const blob=await bkBuild(),old=await gFind('maestro.backup');
  const init=await gf(DR+'upload/drive/v3/files'+(old?'/'+old.id:'')+'?uploadType=resumable',{
   method:old?'PATCH':'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify(old?{}:{name:'maestro.backup',parents:['appDataFolder']})
  });
  await gf(init.headers.get('Location'),{method:'PUT',body:blob});
  toast(t('saved'));
 }catch(e){if(e)toast(t('fail')+why(e))}
}
async function gRestore(){
 try{
  const f=await gFind('maestro.backup');
  if(!f)return toast(t('gNone'));
  toast(t('gDowning'));
  const r=await gf(DR+'drive/v3/files/'+f.id+'?alt=media');
  await bkRestore(await r.blob());
 }catch(e){if(e)toast(t('fail')+why(e))}
}

function box(){
 const hasPw=!!ls.g('pw'),on=!!ls.g('pwbio'),mail=ls.g('gmail');
 const chip=(l,fn)=>E('button',{class:'chip',type:'button',txt:l,on:fn});
 const bioPart=on
  ?E('div',{class:'chips'},chip(t('bioOff'),()=>{rmk('pwbio');window.openSettings()}))

      try{await bioEnable();toast(t('bioDone'));window.openSettings()}catch(e){toast(t('fail')+why(e))}
    }))
   :E('div',{class:'hint',txt:t('bioNeedPw')});

  E('div',{class:'chips'},chip(t('mailSave'),()=>saveMail(mIn.value)),...(mail?[chip(t('mailDel'),()=>{rmk('gmail');window.openSettings()})]:[]))

}

Object.assign(T,{

 hAbout:['مشغّل موسيقى يعمل على جهازك. تسجيل الدخول بـ Google اختياري، ويتيح لك حفظ نسخة احتياطية في حسابك. ملفاتك الصوتية وصورك تبقى على جهازك ولا تُرفع إلا عندما تضغط «حفظ نسخة في Drive».','A music player that runs on your device. Google sign-in is optional and lets you keep a backup in your own account. Your audio files and photos stay on your device and are uploaded only when you tap “Back up to Drive”.','Un lecteur de musique qui fonctionne sur votre appareil. La connexion Google est facultative et permet une sauvegarde dans votre compte. Vos fichiers restent sur l’appareil et ne sont envoyés que lorsque vous touchez « Sauvegarder sur Drive ».']
});
Object.assign(T,{

 mailHint:['اختياري: اكتب بريد Gmail لتعريف حسابك على هذا الهاتف. لا يُرفع شيء إلى الإنترنت.','Optional: enter your Gmail address to identify your account on this phone. Nothing is uploaded online.','Facultatif : saisissez votre adresse Gmail pour identifier votre compte sur ce téléphone. Rien n’est envoyé en ligne.'],

 mailBad:['اكتب بريداً صحيحاً مثل name@gmail.com','Enter a valid email such as name@gmail.com','Saisissez une adresse valide, par ex. name@gmail.com'],
 gCont:['متابعة','Continue','Continuer'],
 gGate:['أدخل بريد Gmail لتعريف حسابك على هذا الهاتف، أو تابع كضيف. كل شيء يبقى على هذا الهاتف ولا يُرفع إلى أي مكان.','Enter your Gmail address to identify your account on this phone, or continue as a guest. Everything stays on this phone and is never uploaded.','Saisissez votre Gmail pour identifier votre compte sur ce téléphone, ou continuez en invité. Tout reste sur ce téléphone et n’est jamais envoyé.'],
 hAbout:['مشغّل موسيقى يعمل على جهازك بالكامل. بريد Gmail اختياري للتعريف فقط، ولا يُرفع شيء إلى الإنترنت. ملفاتك الصوتية وصورك تبقى على جهازك، ولحفظ نسخة احتياطية استخدم «حفظ / مشاركة» من الإعدادات.','A music player that runs entirely on your device. Gmail is optional, for identification only, and nothing is uploaded online. Your audio files and photos stay on your device; to back up, use “Save / share” in Settings.','Un lecteur de musique qui fonctionne entièrement sur votre appareil. Gmail est facultatif, uniquement pour l’identification, et rien n’est envoyé en ligne. Vos fichiers restent sur l’appareil ; pour sauvegarder, utilisez « Enregistrer / partager » dans les Paramètres.']
});

function gate(){

 const err=E('div',{class:'err'});
 const inp=E('input',{type:'text',placeholder:'name@gmail.com',dir:'ltr'});
 inp.style.cssText='width:100%;padding:12px;border:0;border-radius:12px;background:var(--el);color:var(--text);font:600 .95rem Cairo,system-ui;margin-top:8px';

 gst.style.cssText='width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;background:var(--el);color:var(--text);font:800 1rem Cairo,system-ui';
 const g=E('div',{id:'gate'},E('div',{class:'lk'},E('div',{class:'hlogo',bg:LOGO}),E('div',{style:'font-size:1.25rem;font-weight:800;margin:6px 0 8px',txt:'MAESTRO_EFOOT'}),E('p',{class:'hint',txt:t('gGate')}),inp,err,btn,gst));
 g.style.cssText='position:fixed;inset:0;z-index:101;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,var(--c2),var(--c1) 55%,var(--bg))';
 document.body.append(g);

  if(!v){ls.s('guest','1');g.remove();afterGate();return}

 }
}
gate();
})();
